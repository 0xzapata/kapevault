<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>KAPEVault</title>
    <link rel="icon" type="image/svg+xml" href="/src/app/assets/app-icon.svg" />
    <script type="module" src="/src/shell/main.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>KAPEVault</h1>
        <p>Native shell check (debug builds only).</p>
      </header>

      <section aria-labelledby="fingerprint">
        <h2 id="fingerprint">Fingerprint</h2>
        <div class="group">
          <button type="button" class="row" data-action="status">Status <span data-result="status" aria-live="polite"></span></button>
          <button type="button" class="row" data-action="enable">Turn on with a test key <span data-result="enable" aria-live="polite"></span></button>
          <button type="button" class="row" data-action="unlock">Unlock <span data-result="unlock" aria-live="polite"></span></button>
          <button type="button" class="row" data-action="disable">Turn off <span data-result="disable" aria-live="polite"></span></button>
        </div>
      </section>

      <section aria-labelledby="clipboard">
        <h2 id="clipboard">Clipboard</h2>
        <div class="group">
          <button type="button" class="row" data-action="copy">Copy a test secret <span data-result="copy" aria-live="polite"></span></button>
          <textarea id="paste" class="row" rows="1" aria-label="Paste to check the clipboard" placeholder="Paste to check the clipboard"></textarea>
        </div>
      </section>

      <section aria-labelledby="checks">
        <h2 id="checks">Checks</h2>
        <div class="group">
          <div class="row">Sent to background <span data-result="background">0 times</span></div>
          <div class="row">Back in front <span data-result="resume">0 times</span></div>
        </div>
      </section>
    </main>
  </body>
</html>
