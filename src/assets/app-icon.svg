<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- KAPEVault (kape = coffee): an espresso cup from above, latte art poured as a keyhole -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf7ee"/>
      <stop offset="1" stop-color="#ead7bd"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cup" gradientUnits="userSpaceOnUse" x1="70" y1="40" x2="186" y2="216">
      <stop offset="0" stop-color="#6a4430"/>
      <stop offset="1" stop-color="#2d1b12"/>
    </linearGradient>
    <radialGradient id="coffee" cx="0.42" cy="0.36" r="0.7">
      <stop offset="0" stop-color="#9a6438"/>
      <stop offset="1" stop-color="#3a2214"/>
    </radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1a0d06" flood-opacity="0.22"/>
    </filter>
    <mask id="rim" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#fff"/>
      <circle cx="118" cy="128" r="50"/>
    </mask>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#tile)"/>
  <rect width="256" height="256" rx="58" fill="url(#shine)"/>
  <rect x="0.75" y="0.75" width="254.5" height="254.5" rx="57.3" fill="none" stroke="#000" stroke-opacity="0.08" stroke-width="1.5"/>
  <!-- saucer, handle at 3 o'clock (a diagonal handle reads as a magnifying glass), cup, crema, keyhole -->
  <g filter="url(#lift)" transform="translate(4 0)">
    <circle cx="118" cy="128" r="86" fill="url(#cup)" opacity="0.3"/>
    <path d="M176 128H204" stroke="url(#cup)" stroke-width="22" stroke-linecap="round"/>
    <circle cx="118" cy="128" r="64" fill="url(#cup)" mask="url(#rim)"/>
    <circle cx="118" cy="128" r="50" fill="url(#coffee)"/>
    <circle cx="118" cy="128" r="47" fill="none" stroke="#9a6438" stroke-width="3" opacity="0.45"/>
    <g fill="#f6e8d3">
      <circle cx="118" cy="117" r="13"/>
      <path d="M113.5 121H122.5L126 143Q126.5 147 122 147H114Q109.5 147 110 143Z"/>
    </g>
  </g>
</svg>
